<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0E10" />
    <meta name="description" content="Cycle — Your budget. Your cycle." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cycle" />
    <link rel="apple-touch-icon" href="/Cycle/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/Cycle/icons/icon-192.png" />
    <title>Cycle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Poppins:wght@300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet" />
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      html, body, #root { height: 100%; width: 100%; overscroll-behavior: none; background-color: rgb(var(--c-bg, 14 14 16)); }
      body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      ::-webkit-scrollbar { width: 0; height: 0; }
      ::selection { background: rgb(var(--c-accent, 232 195 106) / 0.25); }
    </style>
    <script>
      // Apply the saved look (Classic or Vibe) before anything paints
      (function() {
        try {
          var t = localStorage.getItem('cycle-theme');
          if (t === 'vibe') {
            document.documentElement.dataset.theme = 'vibe';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E0B1F');
          }
        } catch (e) {}
      })();
      (function() {
        var route = sessionStorage.getItem('spa_route');
        if (route) {
          sessionStorage.removeItem('spa_route');
          var target = '/Cycle' + (route.startsWith('/') ? route : '/' + route);
          if (target !== window.location.pathname + window.location.search + window.location.hash) {
            history.replaceState(null, null, target);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
